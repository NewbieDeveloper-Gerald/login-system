<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Login System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="background-wrapper">
    <div class="grid-pattern"></div>
  </div>
  
  <main class="card">
    <!-- Login Form -->
    <div id="loginSection">
      <div class="icon-header">
        <i data-lucide="log-in" class="main-icon"></i>
      </div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper password-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            <button type="button" class="toggle-password" tabindex="-1" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="eye-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="primary-btn">
          <span class="btn-text">Sign In</span>
          <i data-lucide="loader-circle" class="spinner hidden"></i>
        </button>
        <p id="message" class="status-message"></p>
      </form>

      <p class="switch-form">Don't have an account? <a href="#" id="showRegister">Create one</a></p>
    </div>

    <!-- Register Form -->
    <div id="registerSection" class="hidden">
      <div class="icon-header">
        <i data-lucide="user-plus" class="main-icon"></i>
      </div>
      <h1>Create Account</h1>
      <p class="subtitle">Join us today</p>

      <form id="registerForm">
        <div class="input-group">
          <label for="name">Name</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="name" name="name" required autocomplete="name" placeholder="John Doe">
          </div>
        </div>

        <div class="input-group">
          <label for="regEmail">Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="regEmail" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
        </div>

        <div class="input-group">
          <label for="regPassword">Password</label>
          <div class="input-wrapper password-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="regPassword" name="password" required autocomplete="new-password" placeholder="Min. 6 characters">
            <button type="button" class="toggle-password" tabindex="-1" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="eye-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="registerBtn" class="primary-btn">
          <span class="btn-text">Register</span>
          <i data-lucide="loader-circle" class="spinner hidden"></i>
        </button>
        <p id="registerMessage" class="status-message"></p>
      </form>

      <p class="switch-form">Already have an account? <a href="#" id="showLogin">Sign in</a></p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
