<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="background-wrapper">
    <div class="grid-pattern"></div>
  </div>

  <main class="card dashboard-card">
    <div class="dashboard-header">
      <div class="avatar" id="userInitials">
        <i data-lucide="user" class="avatar-icon"></i>
      </div>
      <h1>Dashboard</h1>
      <p class="subtitle">Secure Area</p>
    </div>

    <div class="user-info-box">
      <div class="info-row">
        <span class="info-label"><i data-lucide="user-check" class="sm-icon"></i> Name</span>
        <span class="info-value" id="userName">Loading...</span>
      </div>
      <div class="info-row">
        <span class="info-label"><i data-lucide="mail" class="sm-icon"></i> Email</span>
        <span class="info-value" id="userEmail">Loading...</span>
      </div>
      <div class="info-row">
        <span class="info-label"><i data-lucide="activity" class="sm-icon"></i> Status</span>
        <span class="info-value status-active">Active</span>
      </div>
    </div>
    
    <p id="dashboardMessage" class="status-message"></p>

    <button id="logout" class="outline-btn">
      <i data-lucide="log-out" class="btn-icon"></i>
      Logout
    </button>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initDashboard();
    });
  </script>
</body>
</html>
